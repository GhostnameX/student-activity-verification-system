# Fly.io config for the backend API (apps/api).
# Deploy from the repo root: `fly launch` (first time) or `fly deploy` (after).

app = "ua-api"          # change if this name is already taken on Fly
primary_region = "sin"  # Singapore — closest region to Thailand

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  API_PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false   # keep the machine running — no cold start
  auto_start_machines = true
  min_machines_running = 1     # this is what avoids Render's sleep problem

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    port = 3000
    type = "http"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
