services:
  - type: web
    name: ua-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "onboarding@resend.dev"
      - key: API_PORT
        value: "3000"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
